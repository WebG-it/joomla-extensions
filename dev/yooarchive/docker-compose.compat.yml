# Optional override for the compatibility tests with third-party extensions
# (YOOtheme Pro update, 4SEO, Essentials for YOOtheme Pro). All of them are
# proprietary or licensed: the folders live outside this repository and are only
# mounted read-only. See docs/yooarchive/DEVELOPING.md, "Compatibility tests".
#   docker compose -p yooarchive-j6 --env-file <your env> \
#     -f docker-compose.yml -f docker-compose.compat.yml up -d
services:
  web:
    volumes:
      - ${VENDOR_DIR:?set VENDOR_DIR in your env file}:/vendor:ro
      - ./scripts:/dev-scripts:ro
