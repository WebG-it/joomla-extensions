PLG_SYSTEM_YOOARCHIVE="System - Archive Layouts for YOOtheme"
PLG_SYSTEM_YOOARCHIVE_XML_DESCRIPTION="Adds an <strong>Archived Articles</strong> template type to the YOOtheme Pro builder for the Joomla archive view, with an <strong>Archived Articles</strong> dynamic source (all article fields and custom fields, pagination, ordering, filter form). Optional automation: archived articles are moved to a chosen category and published articles placed in that category are archived."
PLG_SYSTEM_YOOARCHIVE_INSTALL_NO_YOOTHEME="YOOtheme Pro is not installed on this site: the archive template will be available as soon as YOOtheme Pro is installed. The automation works without YOOtheme Pro."

; Plugin options
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_LABEL="Builder template"
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_DESC="In YOOtheme Pro open <em>Templates</em> and click <em>New Template</em>, choose the page <strong>Archived Articles</strong> and assign it by category, page or language. In the layout open <em>Dynamic Content</em> and use the group <strong>Archive</strong>: <em>Archived Articles</em> (list), <em>Archived Article</em> (single) and <em>Archive Information</em> (count, month, year, filter form). The page is the Joomla menu item of type <em>Articles &gt; Archived Articles</em>. Without an assigned template the page is rendered by Joomla as usual."
PLG_SYSTEM_YOOARCHIVE_FIELDSET_AUTOMATION="Automation"
PLG_SYSTEM_YOOARCHIVE_NOTE_AUTOMATION_DESC="The automation is off by default. When on, it keeps the archived articles in one category: <strong>Archive</strong> moves the article to the chosen category, and a published article saved or moved (also by batch) into that category is archived. The archiving goes through the Joomla article model, so Smart Search, cache and the other plugins are updated as with a manual click."
PLG_SYSTEM_YOOARCHIVE_FIELD_AUTOMATION_LABEL="Enable automation"
PLG_SYSTEM_YOOARCHIVE_FIELD_AUTOMATION_DESC="Switch on the automatic sync between the Archived state and the category chosen below."
PLG_SYSTEM_YOOARCHIVE_FIELD_TARGET_CATID_LABEL="Archive category"
PLG_SYSTEM_YOOARCHIVE_FIELD_TARGET_CATID_DESC="Category that holds the archived articles. The automation does nothing until a category is selected."
PLG_SYSTEM_YOOARCHIVE_FIELD_REQUIRE_CREATE_LABEL="Require create permission"
PLG_SYSTEM_YOOARCHIVE_FIELD_REQUIRE_CREATE_DESC="Move archived articles only when the user who archives them can also create articles in the archive category. The user always needs the Edit State permission on the article, articles being edited by another user are never moved, and guests or the command line never move anything."
PLG_SYSTEM_YOOARCHIVE_FIELD_MOVE_ON_ARCHIVE_LABEL="Move archived articles"
PLG_SYSTEM_YOOARCHIVE_FIELD_MOVE_ON_ARCHIVE_DESC="When an article is archived (from the list, the toolbar, the edit form or the API) it is moved to the archive category."
PLG_SYSTEM_YOOARCHIVE_FIELD_REDIRECT_ON_MOVE_LABEL="301 redirect from the old address"
PLG_SYSTEM_YOOARCHIVE_FIELD_REDIRECT_ON_MOVE_DESC="When the category is part of the article address, moving an article into the archive category changes its URL: both when the automation moves an archived article and when a published article moved there by a user is archived. With this option the old address is redirected (301) to the new one through the Joomla <em>Redirects</em> component, so links and search engines do not end on a 404 page. Needs the <em>System - Redirect</em> plugin switched on. Nothing is stored when the address does not change."
PLG_SYSTEM_YOOARCHIVE_FIELD_ARCHIVE_ON_MOVE_LABEL="Archive articles moved into the category"
PLG_SYSTEM_YOOARCHIVE_FIELD_ARCHIVE_ON_MOVE_DESC="When a published article is saved into the archive category, or moved there with Batch, it is archived."
PLG_SYSTEM_YOOARCHIVE_FIELD_FORCE_ARCHIVED_LABEL="Force archived"
PLG_SYSTEM_YOOARCHIVE_FIELD_FORCE_ARCHIVED_DESC="Off: an article that is already in the archive category can be published again on purpose. On: every published article in the archive category is archived again, also when it is republished."

; Builder template
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_LABEL="Archived Articles"
