PLG_SYSTEM_YOOARCHIVE="System - Archive Layouts for YOOtheme"
PLG_SYSTEM_YOOARCHIVE_XML_DESCRIPTION="Adds an <strong>Archived Articles</strong> template type to the YOOtheme Pro builder for the Joomla archive view, with an <strong>Archived Articles</strong> dynamic source (all article fields and custom fields, pagination, ordering, filter form)."
PLG_SYSTEM_YOOARCHIVE_INSTALL_NO_YOOTHEME="YOOtheme Pro is not installed on this site: the archive template will be available as soon as YOOtheme Pro is installed."

; Plugin options
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_LABEL="Builder template"
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_DESC="In YOOtheme Pro open <em>Templates</em> and click <em>New Template</em>, choose the page <strong>Archived Articles</strong> and assign it by category, page or language. In the layout open <em>Dynamic Content</em> and use the group <strong>Archive</strong>: <em>Archived Articles</em> (list), <em>Archived Article</em> (single) and <em>Archive Information</em> (count, month, year, filter form). The page is the Joomla menu item of type <em>Articles &gt; Archived Articles</em>. Without an assigned template the page is rendered by Joomla as usual."

; Builder template
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_LABEL="Archived Articles"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CATID_LABEL="Limit by Categories"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CATID_DESC="The template is only assigned to archive pages whose menu item is filtered by the selected categories. Without a selection it is assigned to every archive page. Use the <kbd>shift</kbd> or <kbd>ctrl/cmd</kbd> key to select multiple categories."
