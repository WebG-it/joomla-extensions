PLG_SYSTEM_YOOARCHIVE="System - Archive Layouts for YOOtheme"
PLG_SYSTEM_YOOARCHIVE_XML_DESCRIPTION="Adds an <strong>Archived Articles</strong> template type to the YOOtheme Pro builder for the Joomla archive view, with an <strong>Archived Articles</strong> dynamic source (all article fields and custom fields, pagination, ordering, filter form)."
PLG_SYSTEM_YOOARCHIVE_INSTALL_NO_YOOTHEME="YOOtheme Pro is not installed on this site: the archive template will be available as soon as YOOtheme Pro is installed."
PLG_SYSTEM_YOOARCHIVE_UPDATE_BLOCKED="Archive Layouts for YOOtheme 2.0 no longer contains the archive automation: it is now the separate plugin <strong>Auto Archive</strong>. Your automation is on and Auto Archive is not installed, or is disabled, or its own automation is off, so this update was stopped and nothing was changed. Install Auto Archive first (or switch it on) (https://github.com/WebG-it/joomla-extensions/releases): it imports your current settings. Then run this update again."
PLG_SYSTEM_YOOARCHIVE_UPDATE_AUTOMATION_MOVED="The archive automation (move archived articles to a category, archive what is placed there) is no longer part of this plugin. The settings of the old version are not used here: Auto Archive holds them."
