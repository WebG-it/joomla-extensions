PLG_SYSTEM_YOOARCHIVE="Sistema - Layout archivio per YOOtheme"
PLG_SYSTEM_YOOARCHIVE_XML_DESCRIPTION="Aggiunge al builder di YOOtheme Pro il tipo di template <strong>Articoli archiviati</strong> per la vista archivio di Joomla, con la sorgente dinamica <strong>Articoli archiviati</strong> (tutti i campi dell'articolo e i campi personalizzati, paginazione, ordinamento, modulo filtri). Automazione facoltativa: gli articoli archiviati vengono spostati in una categoria scelta e gli articoli pubblicati messi in quella categoria vengono archiviati."
PLG_SYSTEM_YOOARCHIVE_INSTALL_NO_YOOTHEME="YOOtheme Pro non è installato su questo sito: il template archivio sarà disponibile appena installi YOOtheme Pro. L'automazione funziona anche senza YOOtheme Pro."

; Opzioni del plugin
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_LABEL="Template del builder"
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_DESC="In YOOtheme Pro apri <em>Template</em> e clicca <em>Nuovo template</em>, scegli la pagina <strong>Articoli archiviati</strong> e assegnala per categoria, pagina o lingua. Nel layout apri <em>Contenuto dinamico</em> e usa il gruppo <strong>Archivio</strong>: <em>Articoli archiviati</em> (elenco), <em>Articolo archiviato</em> (singolo) e <em>Informazioni archivio</em> (numero di articoli, mese, anno, modulo filtri). La pagina è la voce di menu Joomla di tipo <em>Articoli &gt; Articoli archiviati</em>. Senza un template assegnato la pagina resta quella di Joomla."
PLG_SYSTEM_YOOARCHIVE_FIELDSET_AUTOMATION="Automazione"
PLG_SYSTEM_YOOARCHIVE_NOTE_AUTOMATION_DESC="L'automazione è spenta di serie. Se la accendi tiene gli articoli archiviati in una categoria: <strong>Archivia</strong> sposta l'articolo nella categoria scelta, e un articolo pubblicato salvato o spostato (anche con Elaborazione in serie) in quella categoria viene archiviato. L'archiviazione passa dal modello articolo di Joomla, quindi Ricerca intelligente, cache e gli altri plugin si aggiornano come con un clic a mano."
PLG_SYSTEM_YOOARCHIVE_FIELD_AUTOMATION_LABEL="Attiva automazione"
PLG_SYSTEM_YOOARCHIVE_FIELD_AUTOMATION_DESC="Accende la sincronizzazione automatica fra lo stato Archiviato e la categoria scelta qui sotto."
PLG_SYSTEM_YOOARCHIVE_FIELD_TARGET_CATID_LABEL="Categoria archivio"
PLG_SYSTEM_YOOARCHIVE_FIELD_TARGET_CATID_DESC="Categoria che raccoglie gli articoli archiviati. Finché non scegli una categoria l'automazione non fa nulla."
PLG_SYSTEM_YOOARCHIVE_FIELD_REQUIRE_CREATE_LABEL="Richiedi il permesso di creare"
PLG_SYSTEM_YOOARCHIVE_FIELD_REQUIRE_CREATE_DESC="Sposta gli articoli archiviati solo se chi li archivia può anche creare articoli nella categoria archivio. Serve sempre il permesso Modifica stato sull'articolo, gli articoli in modifica da un altro utente non vengono mai spostati e ospiti o riga di comando non spostano nulla."
PLG_SYSTEM_YOOARCHIVE_FIELD_MOVE_ON_ARCHIVE_LABEL="Sposta gli articoli archiviati"
PLG_SYSTEM_YOOARCHIVE_FIELD_MOVE_ON_ARCHIVE_DESC="Quando un articolo viene archiviato (dall'elenco, dalla barra strumenti, dal modulo di modifica o dall'API) viene spostato nella categoria archivio."
PLG_SYSTEM_YOOARCHIVE_FIELD_REDIRECT_ON_MOVE_LABEL="Redirect 301 dal vecchio indirizzo"
PLG_SYSTEM_YOOARCHIVE_FIELD_REDIRECT_ON_MOVE_DESC="Se la categoria fa parte dell'indirizzo dell'articolo, entrare nella categoria archivio cambia l'URL: sia quando l'automazione sposta un articolo archiviato, sia quando archivia un articolo pubblicato spostato lì da un utente. Con questa opzione il vecchio indirizzo viene reindirizzato (301) al nuovo tramite il componente <em>Reindirizzamenti</em> di Joomla, così link e motori di ricerca non finiscono su una pagina 404. Serve il plugin <em>Sistema - Reindirizzamento</em> attivo. Se l'indirizzo non cambia non viene salvato nulla."
PLG_SYSTEM_YOOARCHIVE_FIELD_ARCHIVE_ON_MOVE_LABEL="Archivia gli articoli spostati nella categoria"
PLG_SYSTEM_YOOARCHIVE_FIELD_ARCHIVE_ON_MOVE_DESC="Quando un articolo pubblicato viene salvato nella categoria archivio, o spostato lì con Elaborazione in serie, viene archiviato."
PLG_SYSTEM_YOOARCHIVE_FIELD_FORCE_ARCHIVED_LABEL="Forza archiviato"
PLG_SYSTEM_YOOARCHIVE_FIELD_FORCE_ARCHIVED_DESC="Spento: un articolo che è già nella categoria archivio può essere ripubblicato apposta. Acceso: ogni articolo pubblicato nella categoria archivio viene archiviato di nuovo, anche quando lo ripubblichi."

; Template del builder
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_LABEL="Articoli archiviati"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CATID_LABEL="Limita per categorie"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CATID_DESC="Il template si applica solo alle pagine archivio la cui voce di menu è filtrata sulle categorie selezionate. Senza selezione si applica a tutte le pagine archivio. Usa il tasto <kbd>maiusc</kbd> o <kbd>ctrl/cmd</kbd> per selezionare più categorie."
