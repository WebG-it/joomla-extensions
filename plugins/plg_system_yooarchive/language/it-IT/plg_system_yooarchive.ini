PLG_SYSTEM_YOOARCHIVE_MSG_TARGET_INVALID="Layout archivio: la categoria archivio scelta nelle opzioni del plugin non esiste più o è nel cestino. L'automazione è ferma finché non scegli un'altra categoria."
PLG_SYSTEM_YOOARCHIVE_MSG_TARGET_UNPUBLISHED="Layout archivio: la categoria archivio scelta nelle opzioni del plugin non è pubblicata. Gli articoli che l'automazione sposta lì non compaiono nel sito pubblico, nemmeno nella pagina archivio. Pubblica la categoria o scegline un'altra."
PLG_SYSTEM_YOOARCHIVE_MSG_YOOTHEME_MISSING="Layout archivio: YOOtheme Pro non è installato, quindi il template Articoli archiviati non è disponibile nel builder. L'automazione, se accesa, continua a funzionare."
