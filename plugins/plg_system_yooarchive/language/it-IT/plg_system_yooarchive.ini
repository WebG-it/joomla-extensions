PLG_SYSTEM_YOOARCHIVE="Sistema - Layout archivio per YOOtheme"
PLG_SYSTEM_YOOARCHIVE_XML_DESCRIPTION="Aggiunge al builder di YOOtheme Pro il tipo di template <strong>Articoli archiviati</strong> per la vista archivio di Joomla, con la sorgente dinamica <strong>Articoli archiviati</strong> (tutti i campi dell'articolo e i campi personalizzati, paginazione, ordinamento, modulo filtri)."
PLG_SYSTEM_YOOARCHIVE_INSTALL_NO_YOOTHEME="YOOtheme Pro non è installato su questo sito: il template archivio sarà disponibile appena installi YOOtheme Pro."

; Opzioni del plugin
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_LABEL="Template del builder"
PLG_SYSTEM_YOOARCHIVE_NOTE_BUILDER_DESC="In YOOtheme Pro apri <em>Template</em> e clicca <em>Nuovo template</em>, scegli la pagina <strong>Articoli archiviati</strong> e assegnala per categoria, pagina o lingua. Nel layout apri <em>Contenuto dinamico</em> e usa il gruppo <strong>Archivio</strong>: <em>Articoli archiviati</em> (elenco), <em>Articolo archiviato</em> (singolo) e <em>Informazioni archivio</em> (numero di articoli, mese, anno, modulo filtri). La pagina è la voce di menu Joomla di tipo <em>Articoli &gt; Articoli archiviati</em>. Senza un template assegnato la pagina resta quella di Joomla."

; Template del builder
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_LABEL="Articoli archiviati"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CATID_LABEL="Limita per categorie"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CATID_DESC="Il template si applica solo alle pagine archivio la cui voce di menu è filtrata sulle categorie selezionate. Senza selezione si applica a tutte le pagine archivio. Usa il tasto <kbd>maiusc</kbd> o <kbd>ctrl/cmd</kbd> per selezionare più categorie."
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CHILD_EXCLUDE="Escludi le sottocategorie"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CHILD_INCLUDE="Includi le sottocategorie"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_CHILD_ONLY="Solo le sottocategorie"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_PAGES_LABEL="Limita per numero di pagina"
PLG_SYSTEM_YOOARCHIVE_TEMPLATE_PAGES_DESC="Il template si applica solo alle pagine selezionate."
