PLG_SYSTEM_YOOARCHIVE_NOTE_AUTOMATION_MOVED_DESC="L'automazione (articoli archiviati tenuti in una categoria, redirect 301) è ora il plugin separato <strong>Auto Archive</strong>, che funziona con o senza YOOtheme. Questo plugin aggiunge soltanto il template e le sorgenti Articoli archiviati al builder di YOOtheme Pro."
