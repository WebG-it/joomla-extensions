PLG_SYSTEM_YOOARCHIVE_MSG_REDIRECT_PLUGIN_OFF="Layout archivio: l'automazione salva i redirect 301 dai vecchi indirizzi degli articoli spostati, ma il plugin <em>Sistema - Reindirizzamento</em> è spento e non vengono applicati. Accendi il plugin, oppure spegni l'opzione redirect di Layout archivio."
