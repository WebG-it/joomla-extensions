PLG_SYSTEM_YOOARCHIVE="Sistema - Layout archivio per YOOtheme"
PLG_SYSTEM_YOOARCHIVE_XML_DESCRIPTION="Aggiunge al builder di YOOtheme Pro il tipo di template <strong>Articoli archiviati</strong> per la vista archivio di Joomla, con la sorgente dinamica <strong>Articoli archiviati</strong> (tutti i campi dell'articolo e i campi personalizzati, paginazione, ordinamento, modulo filtri)."
PLG_SYSTEM_YOOARCHIVE_INSTALL_NO_YOOTHEME="YOOtheme Pro non è installato su questo sito: il template archivio sarà disponibile appena installi YOOtheme Pro."
PLG_SYSTEM_YOOARCHIVE_UPDATE_BLOCKED="Layout archivio per YOOtheme 2.0 non contiene più l'automazione dell'archivio: ora è il plugin separato <strong>Auto Archive</strong>. La tua automazione è accesa e Auto Archive non è installato (o è disattivato), quindi l'aggiornamento è stato fermato e non è cambiato nulla. Installa e attiva prima Auto Archive (https://github.com/WebG-it/joomla-extensions/releases): importa le tue impostazioni attuali. Poi rilancia questo aggiornamento."
PLG_SYSTEM_YOOARCHIVE_UPDATE_AUTOMATION_MOVED="L'automazione dell'archivio (sposta gli articoli archiviati in una categoria, archivia quelli messi lì) non fa più parte di questo plugin. Le impostazioni della vecchia versione qui non si usano: le tiene Auto Archive."
